ja:
  # 日付・時刻フォーマット
  date:
    formats:
      default: "%Y年%m月%d日"
      short: "%m/%d"
      long: "%Y年%m月%d日（%A）"
  time:
    formats:
      default: "%Y年%m月%d日 %H:%M"
      short: "%m/%d %H:%M"
      long: "%Y年%m月%d日（%A） %H:%M"

  # 通貨フォーマット
  number:
    currency:
      format:
        unit: "円"
        format: "%n%u"
        separator: "."
        delimiter: ","
        precision: 0
    format:
